    text: Aufgrund des aktuellen Feuerverbots der Stadt Zürich können wir auf dem Bauspielplatz momentan leider kein Feuer machen. Bauen, werken und spielen geht natürlich trotzdem – danke fürs Verständnis und fürs Mithelfen, dass es rund um den Wald sicher bleibt.
